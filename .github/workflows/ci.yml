name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend · Vue 3 + Vite + Tailwind
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Build
        run: npm run build

  backend-python:
    name: Backend · Python FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/biochemverse_ci
      REDIS_URL: redis://localhost:6379/0
      ENV: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/python/requirements*.txt

      - name: Install dependency
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Kompilasi (syntax check)
        run: python -m compileall -q .

      - name: Smoke test API (lifespan + readiness ke Postgres & Redis)
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app
          with TestClient(app) as client:
              assert client.get('/health').json() == {'status': 'ok'}
              ready = client.get('/health/ready')
              assert ready.status_code == 200, ready.text
              modules = client.get('/api/v1/modules')
              assert modules.status_code == 200 and modules.json()['total'] == 3
          print('smoke test OK')
          "

      - name: Validasi spesifikasi OpenAPI
        run: |
          python -c "
          from main import app
          spec = app.openapi()
          assert len(spec['paths']) >= 4, spec['paths']
          assert len(spec['components']['schemas']) >= 7
          print('openapi OK:', sorted(spec['paths']))
          "

  backend-go:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null .
