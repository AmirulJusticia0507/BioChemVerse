# Infrastruktur lokal BioChemVerse: PostgreSQL + Redis
#
# Pakai compose ini HANYA bila service lokal (mis. Laragon) tidak berjalan.
# Jika PostgreSQL lokal sudah memakai port 5432, ubah menjadi "5433:5432".
#
#   docker compose up -d
#   docker compose down          # matikan (volume tetap tersimpan)
#   docker compose down -v       # matikan + hapus data

services:
  postgres:
    image: postgres:16-alpine
    container_name: biochemverse-postgres
    environment:
      POSTGRES_USER: biochemverse
      POSTGRES_PASSWORD: biochemverse
      POSTGRES_DB: biochemverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biochemverse -d biochemverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biochemverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
